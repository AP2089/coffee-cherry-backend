name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - development
          - production

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.environment == 'production' && 'main' || 'development' }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  cd:
    name: CD
    needs: ci
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - name: Deploy backend to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 30m
          script: |
            set -e
            cd /opt/coffee-cherry/${{ inputs.environment }}/backend
            git remote set-url origin https://github.com/AP2089/coffee-cherry-backend.git
            git -c http.extraheader="AUTHORIZATION: bearer ${{ secrets.GITHUB_TOKEN }}" fetch --depth=1 origin ${{ inputs.environment == 'production' && 'main' || 'development' }}
            git reset --hard FETCH_HEAD
            git clean -fd
            cd /opt/coffee-cherry/${{ inputs.environment }}
            docker compose up -d --build backend
            docker compose ps backend
