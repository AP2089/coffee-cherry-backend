name: Deploy

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy-dev:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Deploy backend to dev VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /opt/coffee-cherry/development/backend
            git fetch origin
            git reset --hard origin/development
            cd /opt/coffee-cherry/development
            docker compose up -d --build backend
            docker compose ps backend

  deploy-prod:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy backend to prod VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /opt/coffee-cherry/production/backend
            git fetch origin
            git reset --hard origin/main
            cd /opt/coffee-cherry/production
            docker compose up -d --build backend
            curl -fsS https://coffee-cherry.proskurin.site/api/health
            docker compose ps backend
