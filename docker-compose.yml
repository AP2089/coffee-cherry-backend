services:
  mongodb:
    image: mongo:7
    container_name: coffee-cherry-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coffee-cherry-backend
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      MONGO_URI: mongodb://mongodb:27017/coffee_cherry
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3000
      SUPPORT_AGENT_TOKEN: ${SUPPORT_AGENT_TOKEN:-}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s

volumes:
  mongodb_data:
