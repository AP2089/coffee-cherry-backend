services:
  mongodb:
    image: mongo:4.4
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongo', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: .
    restart: unless-stopped
    ports:
      - '${PORT}:${PORT}'
    environment:
      PORT: ${PORT}
      MONGO_URI: ${DOCKER_MONGO_URI}
      NODE_ENV: ${NODE_ENV}
      CORS_ORIGIN: ${CORS_ORIGIN}
      CORS_RELAXED_LOCAL: ${CORS_RELAXED_LOCAL}
      JWT_SECRET: ${JWT_SECRET:-coffee-cherry-dev-secret}
      SUPPORT_AGENT_TOKEN: ${SUPPORT_AGENT_TOKEN:-}
      UPLOADS_DIR: /app/uploads/images
    volumes:
      - ../frontend/public/images:/app/uploads/images
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:
